# JVM args sized for the 2-core CI runners — the Kotlin/AGP daemons are the
# memory hogs, not the app code.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Parallel + cached. The local build cache lives under ~/.gradle/caches, which
# is exactly what actions/setup-java's `cache: gradle` restores, so compiled
# classes survive between CI runs.
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache cuts a large chunk of per-build overhead. AGP 8.7 supports
# it, but rather than let an unsupported corner fail the build, problems are
# downgraded to warnings: Gradle then simply declines to reuse the cache for that
# build instead of erroring. Toggle to "fail" once the build proves clean.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# 应用版本号基准。这是唯一的权威来源：CI 从这里读出它来生成
# versionName=<base>-pre.<run>（pre 分支）与 pre-release 的 tag，
# 并设置 versionCode=运行号以保证每次都能覆盖安装。
# 另外两处需要同步的是：android-shell/CHANGELOG.md 顶部段落标题。
zcodeBaseVersion=1.0.0
