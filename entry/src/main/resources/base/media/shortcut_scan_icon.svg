<?xml version="1.0" encoding="UTF-8"?>
<!--
  扫码连接快捷方式图标（矢量）
  四角扫描框 + 中央横线。角臂长度 6.8/24（约 28%）、线宽 2.2/24（约 9%），
  保证在桌面快捷方式的小尺寸渲染下四角仍清晰可见；圆角连接柔和直角。
-->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 左上角 -->
        <path d="M2.6 9.4 L2.6 2.6 L9.4 2.6"/>
        <!-- 右上角 -->
        <path d="M14.6 2.6 L21.4 2.6 L21.4 9.4"/>
        <!-- 左下角 -->
        <path d="M2.6 14.6 L2.6 21.4 L9.4 21.4"/>
        <!-- 右下角 -->
        <path d="M14.6 21.4 L21.4 21.4 L21.4 14.6"/>
        <!-- 中央扫描线 -->
        <path d="M2.6 12 L21.4 12"/>
    </g>
</svg>
