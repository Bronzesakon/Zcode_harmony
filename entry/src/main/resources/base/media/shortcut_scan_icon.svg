<?xml version="1.0" encoding="UTF-8"?>
<!--
  扫码连接快捷方式图标（矢量 / SVG）

  依据 HarmonyOS 官方 Symbol 设计规范（设计指南·通用设计基础）：
    标准网格 24×24vp；主体图形限制在 22×22vp 安全区内；
    描边粗细 1.5vp、终点圆头；断口宽度 1.3vp；外圆角 3vp / 内圆角 1.5vp。
  真机实测：启动器把快捷方式图标放入圆形裁剪容器，
            容器直径 ≈ 0.72 × 图标尺寸。据此换算得本图数值：
    · 字形跨度 9.5/24  →  glyph/容器 ≈ 0.55（与官方 22/40 及示例实测 0.551 一致）
    · 线宽 0.65/24     →  stroke/容器 ≈ 0.0375（与官方 1.5/40 及示例实测 0.0385 一致）
    · 最外缘半径 7.04 < 容器半径 8.66，不会触发圆形裁剪
  颜色取系统菜单图标实测值 #5A5F66（非纯黑）。

  SVG 按声明尺寸光栅化，声明过小会放大发虚，故 width/height 取 288（3 倍屏）。

  造型：细线四角扫描框 + 独立中央横线（横线与折线完全断开）。
-->
<svg width="288" height="288" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <g fill="none"
       stroke="#5A5F66"
       stroke-width="0.65"
       stroke-linecap="round"
       stroke-linejoin="round">
        <!-- 左上角 -->
        <path d="M7.25 9.85 L7.25 7.25 L9.85 7.25"/>
        <!-- 右上角 -->
        <path d="M14.15 7.25 L16.75 7.25 L16.75 9.85"/>
        <!-- 左下角 -->
        <path d="M7.25 14.15 L7.25 16.75 L9.85 16.75"/>
        <!-- 右下角 -->
        <path d="M14.15 16.75 L16.75 16.75 L16.75 14.15"/>
        <!-- 中央扫描线 -->
        <path d="M8.1 12 L15.9 12"/>
    </g>
</svg>
